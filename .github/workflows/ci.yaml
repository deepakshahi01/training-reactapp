    branches:
     - main

jobs:
  build-nodejs-artifacts:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Hello nodejs app"
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Setup Node.js environment
        uses: actions/setup-node@v6.2.0
        with:
          node-version: 20.x
          
    

